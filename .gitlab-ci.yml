pages:
  image: rust:1.88-bookworm
  before_script:
    - cargo install mdbook --version 0.4.40 --locked 2>/dev/null || true
  script:
    - cd doc && mdbook build && cd ..
    - mkdir -p public/doc
    - cp -r doc-build/* public/doc/
    - cp index.html public/
    - cp -r favicon.svg public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  cache:
    key: mdbook
    paths:
      - /usr/local/cargo/bin/mdbook
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
